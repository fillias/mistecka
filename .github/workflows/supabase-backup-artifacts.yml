name: Supabase backup to artifacts

on:
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
    contents: read

jobs:
    backup:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: supabase/setup-cli@v1
              with:
                  version: latest

            - name: Show CLI version
              run: supabase --version

            - name: Verify secret exists
              env:
                  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
              run: |
                  test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_DB_URL" && exit 1)

            - name: Dump schema
              env:
                  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
              run: supabase db dump --db-url "$SUPABASE_DB_URL" -f schema.sql

            - name: Dump data
              env:
                  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
              run: supabase db dump --db-url "$SUPABASE_DB_URL" -f data.sql --data-only --use-copy

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: supabase-backup
                  path: |
                      schema.sql
                      data.sql
